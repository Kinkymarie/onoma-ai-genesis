services:
  api:
    build: .
    restart: always
    env_file: [.env]
    environment:
      ENVIRONMENT: production
    depends_on: [db, redis]
  db:
    image: postgres:16-alpine
    restart: always
    env_file: [.env.db]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    restart: always
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api]
volumes:
  pgdata:
