services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      ENVIRONMENT: development
    volumes: ["./app:/srv/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on: [db, redis]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onoma
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
volumes:
  pgdata:
