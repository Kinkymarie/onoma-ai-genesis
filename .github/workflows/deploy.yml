name: Deploy
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - run: for f in configmap pvc database-statefulset redis-deployment backend-deployment ingress; do kubectl apply -f infrastructure/k8s/$f.yaml; done
